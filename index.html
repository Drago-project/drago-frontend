<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Drago - AI-powered learning platform for children with dyslexia"
    />
    <meta name="keywords" content="dyslexia, learning, children, reading" />

    <!-- Open Graph (for sharing on social media) -->
    <meta property="og:title" content="Drago - Dyslexia Learning Platform" />
    <meta
      property="og:description"
      content="Fun learning for dyslexic children"
    />
    <meta property="og:image" content="/app-icon.png" />
    <meta property="og:url" content="https://your-domain.com" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link
      rel="preload"
      href="/fonts/open-dyslexic-font/OpendyslexicRegular-nRLZ0.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <title>Drago</title>

    <style>
      @font-face {
        font-family: "OpenDyslexic";
        src: url("/fonts/open-dyslexic-font/OpendyslexicRegular-nRLZ0.otf")
          format("opentype");
        font-display: swap; /* ← add this */
      }
      @font-face {
        font-family: "Maqroo";
        src: url("/fonts/maqroo-font/Maqroo-Regular.ttf") format("truetype");
        font-display: swap; /* ← add this */
      }

      /* Dyslexia-friendly base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "OpenDyslexic", monospace, Arial, sans-serif;
        line-height: 1.6;
        transition: direction 0.3s ease;
      }

      /* RTL support */
      [dir="rtl"] {
        text-align: right;
        font-family: "Maqroo", "OpenDyslexic", monospace, Arial, sans-serif;
        font-size: larger;
      }

      [dir="ltr"] {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
